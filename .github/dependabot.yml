# Weekly dependency updates, one grouped pull request per ecosystem and directory, so CI
# tests each batch the same way it tests any other change. Major versions are left out:
# they need code changes (Tailwind 4, TypeScript 6, a Next.js upgrade), so they are taken
# deliberately rather than as a weekly bump.
version: 2

updates:
  - package-ecosystem: uv
    directories:
      - /services/*
    schedule:
      interval: weekly
      day: monday
    # pyproject.toml keeps its minimum versions; updates only move uv.lock.
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 6
    groups:
      python:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # torch comes from PyTorch's CPU-only index (see services/enricher/pyproject.toml);
      # bump it by hand so the lock keeps the +cpu build.
      - dependency-name: torch

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    groups:
      web:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /services/*
      - /web
      - /infra/postgres
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # Python 3.12 and Node 22 are the supported runtimes; only take patch-level images.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: weekly
      day: monday
