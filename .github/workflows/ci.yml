name: CI

# No path filters: ci-ok is a required check, and a filtered-out workflow would leave
# pull requests waiting on a check that never reports.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, scraper-ticketmaster, deduper, enricher, matcher, notifier]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.8.14"
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock

      # Integration tests start this image with testcontainers (PostGIS + pgvector).
      - name: Set up Docker Buildx
        if: matrix.service != 'scraper-ticketmaster'
        uses: docker/setup-buildx-action@v4
      - name: Build the Postgres test image
        if: matrix.service != 'scraper-ticketmaster'
        uses: docker/build-push-action@v7
        with:
          context: infra/postgres
          load: true
          tags: concert-radar-postgres:latest
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,scope=postgres,mode=max

      - name: Cache the embedding model
        if: matrix.service == 'enricher'
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - run: uv sync --locked
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy .
      - run: uv run --frozen pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build

  # The single required status check, so matrix changes never break branch protection.
  ci-ok:
    if: always()
    needs: [python, web]
    runs-on: ubuntu-latest
    steps:
      - name: Every CI job passed
        run: |
          test "${{ needs.python.result }}" = success
          test "${{ needs.web.result }}" = success
